apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-attendance-app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksondprice/flint-attendance-app:1.4.0
          envFrom:
            - secretRef:
                name: app-secrets
